name: personal_finance
description: "Личный учёт доходов и расходов для Windows, Android и macOS."
publish_to: 'none'
version: 1.0.0+20

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_localizations:
    sdk: flutter
  drift: ^2.32.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.3
  cryptography: ^2.9.0
  file_picker: ^13.3.3
  flutter_local_notifications: 22.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf

